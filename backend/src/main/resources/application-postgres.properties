# Postgres real - ative com o profile "postgres" (SPRING_PROFILES_ACTIVE=postgres na Railway,
# ou --spring.profiles.active=postgres local com docker-compose up).
#
# PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD sao os nomes que a Railway injeta automaticamente
# quando voce adiciona o addon Postgres ao projeto - nao precisa configurar nada na mao la.
# Os valores depois de ":" sao o fallback para rodar local com o docker-compose.yml.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:educria_aluno}
spring.datasource.username=${PGUSER:educria}
spring.datasource.password=${PGPASSWORD:educria}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false
