# Postgres real - ative com --spring.profiles.active=postgres (ver docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/educria_aluno
spring.datasource.username=educria
spring.datasource.password=educria
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false
