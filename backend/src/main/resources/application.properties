spring.application.name=educria-aluno

# Porta - Railway/Render injetam PORT em runtime; local usa 8080.
server.port=${PORT:8080}

# Segredos locais (API key do Brevo, etc) ficam num arquivo separado, fora do Git.
# Copie application-secrets.properties.example para application-secrets.properties e preencha.
# Sem esse arquivo o backend funciona normal - so nao envia e-mail (ver EmailService).
spring.config.import=optional:classpath:application-secrets.properties

# H2 em memoria - default para rodar/testar sem Docker.
# Para usar Postgres real: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres (ver docker-compose.yml)
spring.datasource.url=jdbc:h2:mem:educria_aluno;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
educria.jwt.secret=${JWT_SECRET:mude-esta-chave-em-producao-para-algo-com-pelo-menos-256-bits}
educria.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS - dominio do front React
educria.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Coordenacao (painel /admin) - troque em producao via env var
educria.admin.senha=${ADMIN_SENHA:admin123}

# E-mail de credenciais via API do Brevo. Valor real vem de application-secrets.properties
# (arquivo local, fora do Git - ver spring.config.import acima) ou das env vars abaixo em
# producao. Sem nenhum dos dois o backend funciona normal, so nao envia e-mail (ver EmailService).
educria.email.brevo-api-key=${BREVO_API_KEY:}
educria.email.remetente=${EMAIL_REMETENTE:}

# Motor adaptativo
educria.motor.nivel-minimo=1
educria.motor.nivel-maximo=10

# Gamificacao
educria.gamificacao.xp-por-acerto=10

# Repeticao espacada (dias)
educria.repeticao.intervalos=1,3,7,16,35,70

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
